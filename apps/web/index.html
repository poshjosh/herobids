<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenAIdom</title>
    <meta name="description" content="OpenAIdom — AI agents that trade, research, and assist. Describe what you want, and an agent gets it for you." />

    <!-- Open Graph -->
    <meta property="og:title" content="OpenAIdom" />
    <meta property="og:description" content="AI agents that trade, research, and assist. Describe what you want, and an agent gets it for you." />
    <meta property="og:image" content="/brand/banner.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://openaidom.com/" />
    <meta property="og:site_name" content="OpenAIdom" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenAIdom" />
    <meta name="twitter:description" content="AI agents that trade, research, and assist. Describe what you want, and an agent gets it for you." />
    <meta name="twitter:image" content="/brand/banner.png" />

    <!-- Favicons: dark theme (default, no media query → applies everywhere as fallback) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-dark/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-dark/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon-dark/apple-touch-icon.png" />

    <!-- Favicons: light theme override (browsers that support media queries on <link> pick these on light OS) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-light/favicon-32x32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-light/favicon-16x16.png" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon-light/apple-touch-icon.png" media="(prefers-color-scheme: light)" />

    <!-- Legacy .ico fallback for older browsers -->
    <link rel="icon" type="image/x-icon" href="/brand/favicon-dark/favicon.ico" />

    <!-- Web App Manifest (dark theme default) -->
    <link rel="manifest" href="/brand/favicon-dark/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
