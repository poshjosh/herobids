# Operator configuration — self-documenting reference.
# Resolution: default.yaml → config/{NODE_ENV}.yaml → environment variables.

llm:
  provider: deepseek                    # LLM provider: openrouter | openai | anthropic | ollama | deepseek
  model: deepseek-v4-flash              # Model for non-agent API calls (e.g. /ai/generate-config). Agent model is set in agent config or user AI settings.
  baseUrl: https://api.deepseek.com  # DeepSeek API base URL (OpenAI-compatible)
  tickIntervalMs: 900000                # Agent reasoning loop interval in ms (how often the agent calls the LLM)

# Alerting — dispatches journal events to Telegram channels.
alerts:
  enabled: true                   # master switch — override: ALERTS_ENABLED
