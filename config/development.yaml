# Operator configuration — self-documenting reference.
# Resolution: default.yaml → config/{NODE_ENV}.yaml → environment variables.

llm:
  tickIntervalMs: 60000         # Agent reasoning loop interval in ms (how often the agent calls the LLM)

# Alerting — dispatches journal events to Telegram channels.
alerts:
  enabled: true                   # master switch — override: ALERTS_ENABLED
