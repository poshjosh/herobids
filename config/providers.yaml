# LLM Provider Registry
# - Provider metadata (IDs, catalog mode, fetch URLs)
# - All pricing now comes from the OpenRouter `llm_pricing_snapshots` table,
#   refreshed hourly by the worker. No model prices are hardcoded here.
# - `pricingSource: 'openrouter'` providers cross-reference their model list
#   and pricing from the active OpenRouter snapshot (prefix-stripped).
# - `pricingSource: 'none'` providers have no pricing (e.g. ollama is free).
# - An empty `models: {}` means "auto-discover all models from OpenRouter."
#   A non-empty models block acts as an allowlist / denylist.
#
# To add a provider: add an entry here.
# Pricing updates automatically (worker fetches hourly from OpenRouter).

providers:
  openai:
    baseUrl: https://api.openai.com/v1
    catalogMode: static
    pricingSource: openrouter
    models: {}

  anthropic:
    baseUrl: https://api.anthropic.com/v1
    catalogMode: static
    pricingSource: openrouter
    models: {}

  deepseek:
    baseUrl: https://api.deepseek.com/v1
    catalogMode: static
    pricingSource: openrouter
    models: {}

  google:
    baseUrl: https://generativelanguage.googleapis.com/v1beta
    catalogMode: static
    pricingSource: openrouter
    models: {}

  openrouter:
    baseUrl: https://openrouter.ai/api/v1
    catalogMode: dynamic
    isMultiProvider: true
    fetchUrl: https://openrouter.ai/api/v1
    models: {}

  ollama:
    baseUrl: http://host.docker.internal:11434/v1  # host.docker.internal resolves correctly both inside Docker and on macOS host
    catalogMode: dynamic
    devOnly: true
    pricingSource: none
    models: {}
