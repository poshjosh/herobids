# Operator configuration — self-documenting reference.
# Resolution: default.yaml → config/{NODE_ENV}.yaml → environment variables.
app:
  logLevel: info

liveRollout:
  enabled: true

llm:
  provider: openrouter                  # LLM provider: openrouter | openai | anthropic | ollama | deepseek
  model: deepseek/deepseek-v4-pro       # Model for non-agent API calls (e.g. /ai/generate-config). Agent model is set in agent config or user AI settings.
  baseUrl: https://openrouter.ai/api/v1 # DeepSeek API base URL (OpenAI-compatible)

agentRuntime:
  llm:
    # UI defaults for model selection forms (Settings page, agent create/edit).
    # These populate the initial values when no user/agent selection exists.
    # They are NOT used as runtime fallbacks — agents must have explicit models.
    modelDefaults:
      provider: openrouter                    # suggested provider in forms
      lightModel: deepseek/deepseek-v4-flash  # suggested economy (scout) model
      heavyModel: deepseek/deepseek-v4-pro    # suggested premium (judge) model
      
# Operator configuration — self-documenting reference.
# Resolution: default.yaml → config/{NODE_ENV}.yaml → environment variables.
#
platformAssessor:
  enabled: true  # disabled by default until shadow mode validated
  llm:
    provider: openrouter                # provider identifier in providers.yaml
    model: anthropic/claude-fable-5     # model ID

alerts:
  email:
    brandImageUrl: https://openaidom.com/brand/compact-mark.png

# PRODUCTION: Billing must be a real provider (not mock). The startup guard
# in apps/*/src/config.ts enforces this — the process will refuse to start if
# billing.primaryProvider is still 'mock' when NODE_ENV=production.
# Set BILLING_PRIMARY_PROVIDER=creem (or stripe) in .env.prod.

# Billing — no default here. The production startup guard (apps/*/src/config.ts)
# enforces non-mock billing when NODE_ENV=production.
# Set BILLING_PRIMARY_PROVIDER=creem (or stripe) in .env.prod.

# Billing — multi-provider subscription billing.
# Use 'mock' for local dev/CI (no credentials needed — checkout auto-fulfills instantly).
# Switch to 'creem' or 'stripe' in production once provider credentials are set.
billing:
  primaryProvider: creem                      # 'mock' | 'creem' | 'stripe'
  creem:
    apiBaseUrl: https://api.creem.io/v1      # auto-switches to test-api if key starts with creem_test_
    planProducts:
      starter:
        - creemProductId: "prod_3Ji0hwm6thepY6HRSzdt6G"    
          interval: month
          displayLabel: "Starter (Monthly)"
          amountCents: 2000   
      pro:
        - creemProductId: "prod_3Kd5cCpAR5VwMmPxgaxvoe"    
          interval: month
          displayLabel: "Pro (Monthly)"
          amountCents: 5000   
# Commercial usage billing — metering, rate cards, spend-state enforcement, and credit ledger.
