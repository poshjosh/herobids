# Operator configuration — self-documenting reference.
# Resolution: default.yaml → config/{NODE_ENV}.yaml → environment variables.
app:
  logLevel: info

llm:
  provider: openrouter                  # LLM provider: openrouter | openai | anthropic | ollama | deepseek
  model: anthropic/claude-haiku-5.5       # Model for non-agent API calls (e.g. /ai/generate-config). Agent model is set in agent config or user AI settings.
  baseUrl: https://openrouter.ai/api/v1 # DeepSeek API base URL (OpenAI-compatible)

agentRuntime:
  llm:
    # UI defaults for model selection forms (Settings page, agent create/edit).
    # These populate the initial values when no user/agent selection exists.
    # They are NOT used as runtime fallbacks — agents must have explicit models.
    modelDefaults:
      provider: openrouter                    # suggested provider in forms
      lightModel: xiaomi/mimo-v2.6-flash  # suggested economy (scout) model
      heavyModel: anthropic/claude-haiku-5.5    # suggested premium (judge) model

# Browser pool runs as the Nomad job infra/nomad/browser-pool.nomad.hcl, not a
# Compose service, so the default Compose URL (http://browser-pool:3000) never
# resolves here. Empty = resolve via Nomad service discovery at worker startup.
browserPool:
  url: ""
      
# Operator configuration — self-documenting reference.
# Resolution: default.yaml → config/{NODE_ENV}.yaml → environment variables.
#

alerts:
  email:
    brandImageUrl: https://openaidom.com/brand/compact-mark.png

# Chat messaging transports, env TELEGRAM_* writes the messaging.chat.telegram.* paths below.
messaging:
  chat:
    telegram:
      botUsername: "OpenAIdomBot" # bot username without @, for t.me deep links; override: TELEGRAM_BOT_USERNAME

plans:
  plans:
    starter:
      entitlements: # required
        skills:
          canCreatePrivateSkills: true
          canViewMarketplaceSkills: true
          canPublishToMarketplace: true
          autoPublishNonDraftSkills: false
          canPriceSkills: true
          canLikeMarketplaceSkills: true
        agents:
          canViewOwnPrompts: false
        blueprints:
          canViewMarketplaceBlueprints: true
          canLikeMarketplaceBlueprints: true
        limits:
          maxAgents: 30
          maxBots: 30
          maxConnections: 15
          maxCredentials: 15
          maxBindings: 150
          maxVenueAccounts: 15
          maxConcurrentBacktests: 3
          liveEnabled: true
      usage: # required
        includedCreditCents: 2000
        softCapCents: 500  # warn when $5 credit left
        hardCapCents: -100 # block when balance ≤ $hardCapCents
        topUpPackIds: 
          - Topup5
          - Topup20
          - Topup50
          - Topup100
          - Topup200
          - Topup500
          - Topup1000
    pro:
      entitlements: # required
        skills:
          canCreatePrivateSkills: true
          canViewMarketplaceSkills: true
          canPublishToMarketplace: true
          autoPublishNonDraftSkills: false
          canPriceSkills: true
          canLikeMarketplaceSkills: true
        agents:
          canViewOwnPrompts: false
        blueprints:
          canViewMarketplaceBlueprints: true
          canLikeMarketplaceBlueprints: true
        limits:
          maxAgents: 90
          maxBots: 90
          maxConnections: 45
          maxCredentials: 45
          maxBindings: 450
          maxVenueAccounts: 45
          maxConcurrentBacktests: 9
          liveEnabled: true
      usage: # required
        includedCreditCents: 5000
        softCapCents: 1000  # warn when $10 credit left
        hardCapCents: -100 # block when balance ≤ $hardCapCents
        topUpPackIds: 
          - Topup5
          - Topup20
          - Topup50
          - Topup100
          - Topup200
          - Topup500
          - Topup1000

# PRODUCTION: Billing must be a real provider (not mock). The startup guard
# in apps/*/src/config.ts enforces this — the process will refuse to start if
# billing.primaryProvider is still 'mock' when NODE_ENV=production.
# Set BILLING_PRIMARY_PROVIDER=creem (or stripe) in .env.prod.

# Billing — no default here. The production startup guard (apps/*/src/config.ts)
# enforces non-mock billing when NODE_ENV=production.
# Set BILLING_PRIMARY_PROVIDER=creem (or stripe) in .env.prod.

# Billing — multi-provider subscription billing.
# Use 'mock' for local dev/CI (no credentials needed — checkout auto-fulfills instantly).
# Switch to 'creem' or 'stripe' in production once provider credentials are set.
billing:
  primaryProvider: stripe                      # 'mock' | 'creem' | 'stripe'
  # fallbackProvider: TBD
  stripe:
    managedPaymentsApiVersion: "2026-08-26.dahlia" # required once any planPrices entry sets managedPayments: true, e.g. "2026-08-26.dahlia"
    planPrices:                                     # map of planId → [{stripePriceId, interval, displayLabel, amountCents, managedPayments}]
      starter:
        - stripePriceId: "price_1UQ7XOC7VFb3lPGjhwRHXvPh"
          interval: month
          displayLabel: "Starter (Monthly)"
          amountCents: 2000
          managedPayments: true 
      pro:
        - stripePriceId: "price_1UQ7XNC7VFb3lPGjUXCXcjHN"
          interval: month
          displayLabel: "Pro (Monthly)"
          amountCents: 5000
          managedPayments: true 
  creem:
    apiBaseUrl: https://api.creem.io/v1      # auto-switches to test-api if key starts with creem_test_
    planProducts:
      starter:
        - creemProductId: "prod_5gbljiByQytxvNSPLdWyEf"
          interval: month
          displayLabel: "Starter (Monthly)"
          amountCents: 2000
      pro:
        - creemProductId: "prod_3fwJ1lOQvZebV4DQw9r6W1"
          interval: month
          displayLabel: "Pro (Monthly)"
          amountCents: 5000
