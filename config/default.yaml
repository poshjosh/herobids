    maxResults: 50                  # Default when agent does not specify a limit; agent may request 1–100 per call
    geckoTerminalExtraPages: 1      # Set to 1 to fetch page 2 of GT trending + top pools (~35 extra tokens, 4 extra req/run)
    antistalenessCooldownHours: 4   # Hours before a token can re-appear at top of discovery. 0 = disabled.
    antistalenessTokenTtlHours: 24  # How long to track a seen address before pruning it
  timeoutMs: 5000

llm:
  provider: ollama              # LLM provider: openrouter | openai | anthropic | ollama
  model: qwen3.6:35b-a3b-q4_K_M # Model for non-agent API calls (e.g. /ai/generate-config). Agent model is set in agent config or user AI settings.
  baseUrl: http://host.docker.internal:11434/v1  # Ollama: use host.docker.internal, NOT localhost inside Docker
  maxTokens: 4096               # Max tokens per LLM call
  timeoutMs: 60000              # LLM call timeout in ms
  # Catalog discovery — controls model listing for dynamic providers (e.g. Ollama /api/tags).
  # Separate from llm.timeoutMs which is tuned for generation; discovery uses a short timeout.
  catalog:
    timeoutMs: 3000             # Max ms to wait for /api/tags before falling back to cached/static models
    cacheTtlMs: 86400000        # Cache TTL in ms (24 h). Stale entries are kept as fallback, not deleted.
  tickIntervalMs: 60000         # Agent reasoning loop interval in ms (how often the agent calls the LLM)
  heartbeatIntervalMs: 5000     # Agent heartbeat cadence in ms
  tradingHours:
    allowedHoursUtc: []         # Empty = always active. Set explicit UTC hours to gate low-liquidity periods.
    weekendPause: false         # If true, pause new no-position ticks from Sat 00:00 UTC to Sun 12:00 UTC.
  retry:
    maxRetries: 2                       # LLM call retry attempts
    timeoutBackoffMs: [5000, 15000]     # per-attempt delay for timeout errors
    serverErrorBackoffMs: 10000         # fixed delay for 5xx errors
    defaultRateLimitBackoffMs: 60000    # fallback when no Retry-After header
  scout:
    maxHoldDurationMs:             # optional: max ms without escalating before a forced escalation. Unset = no limit.
  thinking:
    lightBudgetTokens: 2048    # token budget for light thinking mode
    deepBudgetTokens: 10240    # token budget for deep thinking mode

# Worker process — scan loop and concurrency settings.
worker:
  scanIntervalMs: 5000         # WorkerRuntime scan loop interval in ms
  concurrency: 10              # WorkerRuntime max concurrent trading actors
  agents:
    healthCheckIntervalMs: 2000  # AgentSessionManager health poll cadence in ms
    botOrphanSweepIntervalMs: 60000  # Bot orphan sweep cadence in ms

# ── Runtime Backend ──────────────────────────────────────────────────────────
# Controls which scheduler the worker uses to place agent containers.
#
#   docker  — local Docker daemon (default, single-host, works out of the box)
#   nomad   — HashiCorp Nomad cluster (multi-node orchestration for production)
#   stub    — in-memory fake (local dev without any container runtime at all)
#
# Override: RUNTIME_BACKEND env var.
# runtimeBackend: docker

# Nomad runtime backend — only active when runtimeBackend is 'nomad'.
# The Nomad server must be reachable from the worker container (private network).
nomad:
  addr: http://localhost:4646            # Nomad API URL; override: NOMAD_ADDR
  token:                                 # Nomad ACL token; override: NOMAD_TOKEN
  region: global
  datacenters:
    - dc1
  namespace: herobids-agents             # namespace for agent job isolation
  agentImage: herobids-agent:latest      # Docker image for agent tasks; override: NOMAD_AGENT_IMAGE
  dockerNetwork:                         # Docker network for agent tasks (empty = Nomad default bridge)
  terminationPollIntervalMs: 30000       # how often to poll Nomad for agent allocation crashes (ms)
  requestTimeoutMs: 10000                # Nomad HTTP API request timeout (ms)

# Agent runtime — behavior policy for agent containers.
#
# These are OPERATOR-LEVEL FALLBACKS. Each agent can override every runtime
# field via its `style` (Careful/Balanced/Bold) + `runtime_policy_overrides`
# JSONB column. The effective policy is resolved at agent container startup:
#
#   effective = STYLE_CONFIG[style]  ∪  runtime_policy_overrides
#
# If neither is set, these operator defaults apply as the final fallback.
# Operator ceilings (RUNTIME_POLICY_CEILINGS in packages/domain) cap the
# maximum value for every field — neither user nor agent can exceed them.
#
# Fields controllable per-agent: scoutMaxTurns, judgeMaxTurns, scoutMaxTokens,
# judgeMaxTokens, lightThinkingTokens, deepThinkingTokens, allowedHoursUtc,
# weekendPause, all context budgets, and maxHoldDurationMs.
#
# See docs/features/2026/06/27/007-per-agent-runtime-controls/ for details.
agentRuntime:
  promptStyle: enriched          # 'classic' | 'enriched' — prompt composition strategy
  promptEnrichment:
    memory:
      enabled: true
      maxInlineKeys: 12          # max memory keys rendered inline (older listed by name with overflow)
    judgeHistory:
      hybridMaxResponses: 3      # judge responses injected into hybrid evaluator prompt
      tickMaxDisplayed: 10       # judge history messages passed to the judge itself
    configReference:
      enabled: true              # show trading guardrails block in tick prompt
    queuedSignals:
      enabled: true
      max: 5                     # max queued signals shown (newest first)
    wakeEmphasis:
      enabled: true              # append prioritization instruction to wake context
    activityTimeline:
      enabled: true
      maxEvents: 10              # max events shown in timeline (oldest → newest)
  failureBackoff:
    backoffThreshold: 3        # consecutive failures before doubling tick interval
    maxFailures: 5             # consecutive failures before agent shutdown
    maxIntervalMs: 1800000     # cap on backed-off tick interval (30 min)
  toolCircuitBreaker:
    failureThreshold: 3        # consecutive tool failures before circuit opens
    reopenAfterTicks: 5        # 1 means: circuit is locked for the remainder of the current tick, 
                               # then available again at the start of the next tick.
                               # 5 for trading agents to avoid hammering a broken venue/platform
  sessionCircuitBreaker:
    enabled: true
    strategyError:
      maxInWindow: 10
      windowMs: 60000
    drift:
      maxInWindow: 5
      windowMs: 300000
    streamDisconnect:
      maxInWindow: 5
      windowMs: 300000
    cooldownMs: 300000
    maxTrips: 3
    probeIntervalMs: 60000
  thinking:
    drawdownThresholdPct: -2   # drawdown % that triggers deep thinking mode
  llm:
    # UI defaults for model selection forms (Settings page, agent create/edit).
    # These populate the initial values when no user/agent selection exists.
    # They are NOT used as runtime fallbacks — agents must have explicit models.
    modelDefaults:
      provider: ollama                      # suggested provider in forms
      lightModel: qwen3:8b                   # suggested economy (scout) model
      heavyModel: qwen3.6:35b-a3b-q4_K_M     # suggested premium (judge) model
    scout:
      maxTurns: 10             # cap read-only scout tool rounds; raise for deeper discovery, lower to bound latency and spend
      maxTokens: 1024          # scout response budget per turn; increase only if scout JSON/tool planning is getting truncated
      temperature: 0           # keep scout deterministic so repeated scouting converges on the same escalation decision
    judge:
      maxTurns: 25             # cap full judge/tool rounds; higher values improve persistence but can amplify bad tool loops and cost
      temperature: 0.3         # modest exploration for judge synthesis; lower values make actions more repeatable during incidents
  wake:
    minIntervalMs: 15000       # minimum cooldown between wake-driven ticks; lower reacts faster, higher suppresses bursty market churn
    pollMs: 1000               # Redis wake-stream block timeout; lower improves wake pickup latency, higher reduces idle polling churn
  marketIntelligence:
    maxTrackedPerps: 3         # number of perp symbols to enrich per tick; raise for broader awareness, lower to protect market-data budgets
    maxTrackedDexTargets: 3    # number of DEX watch targets to consider per tick before refresh fanout is applied
    maxRefreshedDexTargetsPerTick: 2  # number of tracked DEX targets to refresh each tick; keep below breadth cap to avoid hot-looping token lookups
  scannerSignalDedup:
    enabled: true              # disable to skip fingerprint check and always emit scanner wakes
    topN: 5                    # top N signals included in fingerprint (rank-insensitive, canonicalized alphabetically)
    confidenceBucketSize: 0.05 # confidence band for fingerprint bucketing (<=0.05 noise absorbed)
    ttlSeconds: 600            # fingerprint TTL in Redis — forces eventual re-evaluation even with unchanging signals
  # In-cycle bounded retry for transient candle fetch failures (rate limits, 5xx, timeouts).
  # Retries happen within a single scan with jittered backoff. Fail-open when absent.
  candleFetchRetry:
    enabled: true
    maxRetries: 3              # in-cycle retries before giving up on a symbol this scan
    baseDelayMs: 250           # first retry delay; grows ×2 with full jitter
    maxDelayMs: 2000           # per-retry ceiling (stays well within one scan)
  # Cross-scan circuit breaker for symbols that fail every retry across consecutive scans.
  # Skip duration is measured in scan cycles, not milliseconds, so it is cadence-aware.
  candleFetchBreaker:
    enabled: true
    failScansBeforeOpen: 3     # consecutive fully-failed scans before opening the breaker
    baseSkipScans: 2           # skip this many scan cycles when breaker first opens
    maxSkipScans: 8            # ceiling on skip cycles (grows ×2 per opening up to this cap)
  # ── Scanner subsystem ──────────────────────────────────────────────────────
  # Operator-level control for swap (DEX) venue scanning.
  # scanner.swap.enabled = master kill-switch for all swap-bound agents.
  # scanner.swap.venues.<venue> = per-venue rollout flags (absent/true = enabled
  #   when master switch is on; false = explicitly disabled).
  scanner:
    swap:
      enabled: false            # DEFAULT: false — safe rollout. Set to true to enable DEX scanning.
      venues:
        jupiter: true           # Enable Jupiter (Solana) scanning when master switch is on.
        1inch: true             # Enable 1inch (Base) scanning when master switch is on.
  # Cross-session crash-loop guard — persist crash counters in Redis and block
  # relaunch when an agent has crashed too many times within the sliding window.
  crashLoopGuard:
    enabled: true
    maxCrashesInWindow: 3     # crashes within the window before relaunch is blocked
    windowMs: 300000          # 5-minute sliding window
  contextDiff:
    fullContextEveryTicks: 10  # force full context every N ticks (not a diff)
    maxDiffTokens: 200         # fall back to full context if diff exceeds this token budget
    maxChangedLines: 12        # truncate diff at this many changed lines
  defaultBudgets:
    maxHistoryMessages: 20
    maxHistoryTokens: 40000
    maxRecentToolMessages: 6
    maxToolResultChars: 4000
    maxVisibleToolSchemas: 64
    maxContextBlockChars: 4000
    toolResultFullRetentionTurns: 3    # keep full tool results for the most recent N turns; older results are truncated
    toolResultMaxStaleChars: 500       # max chars to retain for tool results older than fullRetentionTurns
  sandboxDefaults:
    cpuShares: 256             # Docker CpuShares (relative weight vs other containers)
    memoryMb: 512              # Docker Memory limit in MB (cgroup hard limit)
    maxWallClockMs: 0          # how long an agent session lives. 0 = unlimited
    tempStorageMb: 100         # Docker tmpfs/storage limit in MB
    maxProcesses: 50           # ulimit nproc: max concurrent processes inside container
    maxRequestsPerMinute: 60   # in-process outbound request rate limit
    maxConcurrentConnections: 10  # in-process concurrent connection limit
    maxResponseBytes: 10485760    # max single response size (10 MB)
    maxTotalDownloadBytes: 104857600  # max total download per session (100 MB)
  # Per-tier resource profiles for agent runtime containers.
  #
  # These profiles configure scheduler-level resource constraints applied to
  # each agent container based on the owner's plan tier (free, pro, enterprise).
  # The operator controls the absolute ceiling per tier — plan-specific product
  # behaviour (e.g. enterprise-only dedicated nodes) can evolve separately.
  #
  # Each profile sets:
  #   memoryLimitMb       — hard memory ceiling (OOM kill boundary)
  #   memoryReservationMb  — soft memory for scheduling decisions (≤ memoryLimitMb)
  #   cpuShares           — relative CPU weight (Docker CpuShares / Nomad cpu shares)
  #   maxProcesses        — PID limit inside the container
  #   tempStorageMb       — /tmp tmpfs size limit
  #   maxWallClockMs      — runtime wall-clock timeout (0 = unlimited)
  #
  # Strategy: soft-overcommit model.
  #   free/pro: 512 MB hard limit, 256 MB scheduling reservation
  #   free/pro: same baseline to keep costs low; differentiation via other entitlements
  #   enterprise: 2 GB hard limit with tighter (50%) reservation for denser packing
  #
  # Fallback: when a plan tier has no matching profile, the launcher uses
  # sandboxDefaults above.
  # Autoscale: the autoscaler (Phase 6) reads these reservations to compute
  # cluster headroom — changing reservation values here changes provisioning
  # thresholds without code edits.
  resourceProfiles:
    free:
      memoryLimitMb: 512
      memoryReservationMb: 256
      cpuShares: 256
      maxProcesses: 50
      tempStorageMb: 100
      maxWallClockMs: 0
    pro:
      memoryLimitMb: 512
      memoryReservationMb: 256
      cpuShares: 256
      maxProcesses: 50
      tempStorageMb: 100
      maxWallClockMs: 0
    enterprise:
      memoryLimitMb: 2048
      memoryReservationMb: 1024
      cpuShares: 512
      maxProcesses: 100
      tempStorageMb: 500
      maxWallClockMs: 0
  tools:
    codeExecute:
      defaultTimeoutMs: 60000      # execute_code timeout when no capability grant present
      defaultMaxOutputBytes: 51200  # execute_code max output when no capability grant present
    webAccess:
      tavily:
        baseUrl: "https://api.tavily.com"
        searchDepth: basic
        maxResults: 5
        timeoutMs: 15000
      browseUrl:
        maxResponseBytes: 524288   # 512 KB
        timeoutMs: 15000

llmValidation:
  requirePinnedModel: true
  minReplayContexts: 100
  maxDecisionDivergencePct: 20
  maxPnlRegressionPct: 10

# Live rollout gating — fail-closed operator policy for live execution mode.
# All checks must pass before an instance is allowed to trade live.
liveRollout:
  enabled: false                          # master switch — must be true for any live instance to start
  allowedVenues:                          # venues permitted to execute live orders
    - hyperliquid
    - 1inch
    - bybit
    - jupiter
  requireDbCredentials: true              # reject env-var credential fallback for live mode
  maxInitialOrderNotionalUsd: "10000"     # hard cap on single-order notional (USD) during rollout
  maxConsecutiveVenueErrors: 3            # circuit-breaker: halt after N consecutive venue errors
  slippageAlertBps: 50                    # log warning when fill slippage exceeds this
  limitOrderTimeoutMs: 120000             # cancel stale live limit orders after this timeout
  marketOrderTimeoutMs: 30000             # mark unresolved live market orders as recovery-required after this timeout
  timeoutCheckIntervalMs: 10000           # frequency of live timeout scans
  crashPolicy: alert_manual_intervention  # auto_go_flat | alert_manual_intervention

# ── Platform Assessor ──────────────────────────────────────────────────────
# On-demand per-symbol assessment — no scheduled background generation.
# The assessor runs only when an agent explicitly requests it via
# get_market_preset_assessment after receiving review advice through the
# dedicated assessment_review tick.
platformAssessor:
  enabled: true  # disabled by default until shadow mode validated
  minReviewIntervalMs: 10800000  # 3h — operator floor for agent reviewIntervalMs
  # maxReviewRequestsPerDay: 50  # optional daily cap (unset = no cap)
  scannerCandidateLimit: 20  # top N candidates for deterministic pre-check
  cacheFreshnessMs: 10800000  # 3h — lookup and artifact expiry
  maxConcurrentAssessments: 1
  maxInstrumentsPerRequest: 3  # max instruments per assessment request
  # ── Evidence collection policies ──────────────────────────────────────
  evidenceMaxAgeMs: 300000          # 5 min — max age for collected evidence
  evidenceTimeoutMs: 15000          # 15s — timeout for evidence operations
  evidencePayloadLimitBytes: 1048576 # 1 MB — max evidence payload size
  candlePolicy:
    defaultInterval: 15m
    minimumCandles: 48
    maxCandles: 200
  atrPolicy:
    lookbackPeriods: 14
    volatilityLowPercentile: 25
    volatilityHighPercentile: 75
    volatilityExtremePercentile: 95
    calculationVersion: "1.0.0"
  liquidityPolicy:
    goodSpreadBpsMax: 5
    goodDepthUsdMin: 50000
    adequateSpreadBpsMax: 25
    adequateDepthUsdMin: 10000
  # breadthPolicy:  # omitted until a valid cohort source is configured
  #   movingAveragePeriods: ["50"]
  #   minimumSymbols: 5
  #   maxLookbackDays: 30
  sourceMappings: {}  # per-venue-family overrides — defaults resolve from context
  # ── Deterministic Review Pre-Check ────────────────────────────────────
  # Configuration for the scanner pre-check that produces assessment review
  # advice without LLM calls or billing. The pre-check reads persisted
  # scanner candidate observations and applies a deterministic predicate.
  preCheck:
    signalRatioThreshold: 2.0          # peer preset must have >= 2× signal count to flag mismatch
    scanMetricsLookbackMs: 86400000    # 24h lookback for scan metrics comparison
    minSignalsForActive: 3             # minimum signals to consider a preset "active"
    identityCooldownMs: 86400000       # 24h cooldown per (agent, identity)
    candidateRetentionMs: 604800000    # 7d retention for persisted candidates
    candidateMaxAgeMs: 86400000        # 24h max age for a candidate to be considered
    maxAdvicePayloadSize: 16384        # 16 KB max advice payload
    leaseDurationMs: 60000             # 60s review-check lease
    billingPreflightTimeoutMs: 5000    # 5s read-only billing preflight timeout
    policyVersion: "1.0.0"             # review predicate version
    enablePeerComparison: true         # whether to compare peer presets for mismatch
  # ── Platform LLM ranking configuration ────────────────────────────────
  # The platform assessor uses its own LLM config (never an agent's config).
  # Provider and model must exist in the loaded provider registry at startup.
  llm:
    provider: ollama                    # provider identifier in providers.yaml
    model: qwen3.6:35b-a3b-q4_K_M       # model ID
    timeoutMs: 30000                    # 30s HTTP timeout
    maxTokens: 2000                     # max output tokens for ranking response
    maxInputTokens: 4000                # max input tokens for prompt projection
    # baseUrl: https://...              # optional base URL override
    maxConcurrency: 1                   # max concurrent assessment LLM calls
    retry:
      maxRetries: 2
      timeoutBackoffMs: [5000, 15000]
      serverErrorBackoffMs: 10000
      defaultRateLimitBackoffMs: 60000
    scoreBands:
      aMin: 80
      bMin: 60
      cMin: 40
      dMin: 20
    recommendationPolicy:
      minConfidence: 0.6               # min confidence for auto-recommendation
      minScoreForRecommendation: 40    # min score for auto-recommendation
      minAllowedScore: 1               # score 0 = exclude from allowedPresets

# Market intelligence — always-on discovery coordinator and monitor.
# Controls the background market intelligence subsystem that wakes agents
# when market conditions match their registered watches.
marketIntelligence:
  enabled: true                    # master switch for the entire subsystem
  evaluationIntervalMs: 5000       # monitor evaluation loop interval
  discoveryPollMs: 30000           # how often the coordinator polls discovery sources
  regimePollMs: 60000              # how often the coordinator polls regime sources
  networks:                        # networks to scan for discovery
    - solana
    - base
  benchmarkSymbols:                # symbols for regime evaluation
    - BTC
  families:                        # per-family toggles for the monitor
    watchThresholds:
      enabled: true
    discoveryDeltas:
      enabled: true
    regimeChanges:
      enabled: true
  wakeCoalescingWindowMs: 3000      # (operator) how long to hold a wake in its source bucket before flushing, allowing
                                    # multiple events for the same (agent, source) to coalesce into a single wake.
                                    # Lower = more immediate wakes but less batching. Default: 3000ms.
  wakeCooldownMs: 30000             # (operator) fallback cooldown between successive wakes to the same agent
                                    # for any source NOT explicitly listed in wakePolicy below. Default: 30000ms.
  # ── Per-Source Wake Policy ─────────────────────────────────────────────
  # Delivery modes:
  #
  #   wake     — wake the actor immediately for every event. Use for: urgent 
  #              actionable signals (e.g. price watches).
  #
  #   batched  — enqueue a single agent.wake signal for all events that arrive within 
  #              the coalescing window. Use for: high-volume signals that are actionable 
  #              but not urgent (e.g. discovery deltas).
  #
  #   context  — do not wake the actor; instead, enrich the next scheduled tick with the 
  #              events. Use for: low-volume signals that are informative but not actionable 
  #              (e.g. regime changes).
  wakePolicy:
    scanner:
      mode: wake                   # wake the agent immediately for every scanner event
      cooldownMs: 120000           # 2 min between successive scanner wakes per agent
    # triggered when a user-configured price watch crosses its threshold (e.g. "BTC drops below $61,000").
    watch_threshold:
      mode: wake                   
      cooldownMs: 15000            # 15s between successive watch-threshold wakes per agent
    # triggered when a token enters the top discovery set or reappears after a cooldown period. 
    discovery_delta:
      mode: context                
      cooldownMs: 300000           # 5 min between successive discovery-delta deliveries per agent
    # triggered when the market regime flips (e.g. favorable → unfavorable).  
    regime_change:
      mode: batched  
      # We figured that rapid regime changes are more confusing than anything else 
      # So we went for a higher cooldown to avoid waking the agent too frequently.
      cooldownMs: 900000           # 15 min between successive regime-change deliveries per agent

# Alerting — dispatches journal events to Telegram channels.
alerts:
  enabled: false                    # controls whether the system dispatches journal events to Telegram channels — it doesn't affect agent-to-user communication via tools like send_message
  dispatchIntervalMs: 10000         # poll interval for new events
  defaultCooldownMs: 300000         # 5 min cooldown between duplicate alert types
  maxBatchSize: 20                  # max events per dispatch cycle
  maxRetries: 3                     # delivery attempts before permanent failure
  telegram:
    botToken: ""                    # override: TELEGRAM_BOT_TOKEN
    webhookSecret: ""               # override: TELEGRAM_WEBHOOK_SECRET
    # webhookUrl: "https://your-public-host/telegram/webhook"  # override: TELEGRAM_WEBHOOK_URL
    channels: []                    # configured via env-specific yaml
  email:
    provider: ses                   # outbound provider — override: EMAIL_PROVIDER
    fromEmail: ""                   # sender address (must be verified in SES) — override: EMAIL_FROM_EMAIL
    replyToEmail: ""                # optional reply-to address — override: EMAIL_REPLY_TO_EMAIL
    timeoutMs: 10000                # request timeout in ms — override: EMAIL_TIMEOUT_MS
    # brandImageUrl: ""            # absolute URL to brand wordmark for email header — override: EMAIL_BRAND_IMAGE_URL (defaults to typographic header)
    ses:
      region: us-east-1             # AWS region — override: AWS_REGION
      # configurationSetName: ""    # optional config set — override: SES_CONFIGURATION_SET_NAME

# Authentication — Google OAuth + JWT sessions.
auth:
  publicBaseUrl: http://localhost:3000    # override: AUTH_PUBLIC_BASE_URL
  frontendOrigin: http://localhost:5173   # override: AUTH_FRONTEND_ORIGIN (Vite dev server default)
  jwtSecret: change-me-in-production-this-is-32-chars!!  # override: AUTH_JWT_SECRET
  jwtTtlSecs: 86400                      # 24h — override: AUTH_JWT_TTL_SECS
  exchangeCodeTtlSecs: 60                # seconds — override: AUTH_EXCHANGE_CODE_TTL_SECS
  googleClientId: ""                     # override: GOOGLE_CLIENT_ID
  googleClientSecret: ""                 # override: GOOGLE_CLIENT_SECRET
  secureCookie: false                    # set true in production (HTTPS only)
  loginLinkTtlSecs: 1800                 # 30 min — override: AUTH_LOGIN_LINK_TTL_SECS
  loginLinkResendCooldownSecs: 60        # 1 min — override: AUTH_LOGIN_LINK_RESEND_COOLDOWN_SECS
  loginLinkMaxSendsPerWindow: 5          # max sends per email per window — override: AUTH_LOGIN_LINK_MAX_SENDS_PER_WINDOW
  loginLinkWindowSecs: 3600              # 1 hour rolling window — override: AUTH_LOGIN_LINK_WINDOW_SECS
  loginLinkMaxSendsPerIpWindow: 10       # max sends per IP per window — override: AUTH_LOGIN_LINK_MAX_SENDS_PER_IP_WINDOW

# Plan enforcement — coarse resource limits per user plan.
#
# - plans...includedCreditCents is for usage.
# - billling...amountCents is for access to our services i.e. subscription.
# Example:
# plans.<planId>.usage.includedCreditCents = 1000 (USD 10)
# billing.<provider>.plan<Product|Pricing>.interval = monthly
# billing.<provider>.plan<Product|Pricing>.amountCents = 1000 (USD 10)
# For the above example: 
# - user pays amountCents per month for access to our services
# - usage is deducted from includedCreditCents
plans:
  defaultPlanId: free # required
  plans:
    free:
      entitlements: # required
        skills:
          canCreatePrivateSkills: false
          canViewMarketplaceSkills: true
          canPublishToMarketplace: true
          autoPublishNonDraftSkills: true
          canPriceSkills: false
          canLikeMarketplaceSkills: true
        agents:
          canViewOwnPrompts: false
        limits:
          maxAgents: 1
          maxBots: 3
          maxConnections: 5
          maxCredentials: 5
          maxBindings: 5
          maxVenueAccounts: 5
          maxConcurrentBacktests: 0
          liveEnabled: true
      usage: # required
        includedCreditCents: 0
        topUpPackIds: 
          - Topup5
          - Topup20
          - Topup50
          - Topup100
          - Topup200
          - Topup500
          - Topup1000
    starter:
      entitlements: # required
        skills:
          canCreatePrivateSkills: true
          canViewMarketplaceSkills: true
          canPublishToMarketplace: true
          autoPublishNonDraftSkills: false
          canPriceSkills: true
          canLikeMarketplaceSkills: true
        agents:
          canViewOwnPrompts: false
        limits:
          maxAgents: 3
          maxBots: 9
          maxConnections: 15
          maxCredentials: 15
          maxBindings: 15
          maxVenueAccounts: 15
          maxConcurrentBacktests: 3
          liveEnabled: true
      usage: # required
        includedCreditCents: 2000
        topUpPackIds: 
          - Topup5
          - Topup20
          - Topup50
          - Topup100
          - Topup200
          - Topup500
          - Topup1000
          
# Billing — multi-provider subscription billing.
# Use 'mock' for local dev/CI (no credentials needed — checkout auto-fulfills instantly).
# Switch to 'creem' or 'stripe' in production once provider credentials are set.
billing:
  primaryProvider: mock                       # 'mock' | 'creem' | 'stripe'
  # fallbackProvider: creem                   # optional — uncomment to enable failover
  stripe:
    secretKey: ""                             # override: STRIPE_SECRET_KEY
    webhookSecret: ""                         # override: STRIPE_WEBHOOK_SECRET
    customerPortalConfigurationId: ""         # optional Stripe portal config ID
    planPrices: {}                            # map of planId → [{stripePriceId, interval, displayLabel, amountCents}]
  creem:
    apiKey: ""                                # override: CREEM_API_KEY
    webhookSecret: ""                         # override: CREEM_WEBHOOK_SECRET
    apiBaseUrl: https://api.creem.io/v1       # auto-switches to test-api if key starts with creem_test_
    planProducts: {}                          # map of planId → [{creemProductId, interval, displayLabel, amountCents}]

# Commercial usage billing — metering, rate cards, spend-state enforcement, and credit ledger.
usageBilling:
  defaultCurrency: USD
  runtimeChargeWindowMs: 60000             # coarse agent runtime metering window in ms
  warningThresholdsPct: [80, 100]          # % of hard cap at which to emit spend warnings
  defaultRateCardName: default             # rate card to use when opening new billing periods
  creditTopUpsEnabled: true                # whether users can purchase credit top-ups
  topUpProductsByProvider:                 # provider → [{packId, externalId, cents}]
    mock:
      - packId: Topup5
        externalId: Topup5
        cents: 500        
      - packId: Topup20
        externalId: Topup20
        cents: 2000        
      - packId: Topup50
        externalId: Topup50
        cents: 5000        
      - packId: Topup100
        externalId: Topup100
        cents: 10000
      - packId: Topup200
        externalId: Topup200
        cents: 20000        
      - packId: Topup500
        externalId: Topup500
        cents: 50000        
      - packId: Topup1000
        externalId: Topup1000
        cents: 100000
    creem:
      - packId: Topup5
        externalId: prod_13TZZ9AsdyFtGoY2BqVYAy
        cents: 500        
  fallbackCacheReadPct: 75                 # % of input rate to use as cache-read rate when provider has no explicit cache price
  failedRequestOutputPct: 75               # % of maxTokens to bill as estimated output on failed (timeout/server-error) LLM calls
  defaultRateCardItems:                    # seed items for how much each type of agent activity costs
    - meterKey: "agent.runtime_ms"
      priceMicrousd: 100
      perUnit: 60000
    - meterKey: "assessment.request"
      priceMicrousd: 200000
      perUnit: 1

# ---------------------------------------------------------------------------
# Env-only overrides — read directly from process.env, not part of AppConfigSchema
# ---------------------------------------------------------------------------
#
# Agent runtime (worker) — orchestration layer, not operator config:
#   AGENT_RUNTIME_MODE          docker | stub (default: stub)
#                               stub = heartbeat-only fake for local dev without Docker-in-Docker
#   DOCKER_HOST                 Docker socket URL (default: tcp://docker-proxy:2375)
#   DOCKER_NETWORK              Container network name (default: herobids_default)
#   AGENT_IMAGE                 Agent container image tag (default: herobids-agent:latest)
#   LLM_TICK_INTERVAL_MS        Agent reasoning loop interval in ms (override: llm.tickIntervalMs)
#   LLM_HEARTBEAT_INTERVAL_MS   Agent heartbeat cadence in ms (override: llm.heartbeatIntervalMs)
#
# Logging:
#   LOG_FORMAT              json | pretty (auto-set to pretty when NODE_ENV=development)
#   LOG_LEVEL               debug | info | warn | error — agent container only
#                           (API/worker use app.logLevel above)

integrations:
  gmail:
    clientId: ""                   # override: GMAIL_CLIENT_ID
    clientSecret: ""               # override: GMAIL_CLIENT_SECRET
    redirectUri: ""                # override: GMAIL_REDIRECT_URI (auto-derived if empty: {publicBaseUrl}/connections/oauth/gmail/callback)
    dailySendLimit: 50             # override: GMAIL_DAILY_SEND_LIMIT — max emails per agent per day
