services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: herobids
      POSTGRES_PASSWORD: herobids
      POSTGRES_DB: herobids
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U herobids']
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    environment:
      DATABASE_URL: postgres://herobids:herobids@postgres:5432/herobids
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - '3000:3000'
    volumes:
      - evaldata:/app/app-data
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://herobids:herobids@postgres:5432/herobids
      REDIS_URL: redis://redis:6379
      EVALUATION_STORAGE_ROOT: /app/app-data/evaluation-output
      # Route Docker API calls through the restricted TCP proxy instead of raw Unix socket.
      DOCKER_HOST: tcp://docker-proxy:2375
      # PORT must stay in sync with the healthcheck below and app.port in config/default.yaml.
      # Changing app.port without updating PORT here will leave the container permanently unhealthy.
      PORT: '3000'
      AUTH_PUBLIC_BASE_URL: http://localhost:3000
      AUTH_FRONTEND_ORIGIN: http://localhost:5173
    healthcheck:
      # Uses $${PORT:-3000} (double-$ so Compose does NOT expand it at parse time;
      # the container shell resolves ${PORT:-3000} at runtime against the PORT env
      # var set above, keeping the probe aligned with what the app actually binds to).
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:$${PORT:-3000}/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  docker-proxy:
    image: tecnativa/docker-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      POST: 1
      EVENTS: 1
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      SWARM: 0
      BUILD: 0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    volumes:
      - evaldata:/app/app-data
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://herobids:herobids@postgres:5432/herobids
      REDIS_URL: redis://redis:6379
      EVALUATION_STORAGE_ROOT: /app/app-data/evaluation-output
      DOCKER_HOST: tcp://docker-proxy:2375
      DOCKER_NETWORK: herobids_default
      AGENT_IMAGE: herobids-agent:latest
      # Requires the agent image to be built first:
      # docker build -f docker/Dockerfile.agent -t herobids-agent:latest .
      # For local dev without Docker-in-Docker, override: AGENT_RUNTIME_MODE=stub docker compose up
      AGENT_RUNTIME_MODE: docker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  evaldata:
