services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: herobids
      POSTGRES_PASSWORD: herobids
      POSTGRES_DB: herobids
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U herobids']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    environment:
      DATABASE_URL: postgres://herobids:herobids@postgres:5432/herobids
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://herobids:herobids@postgres:5432/herobids
      REDIS_URL: redis://redis:6379
      # Dev-only defaults — override via .env or environment in production.
      AUTH_JWT_SECRET: docker-local-dev-secret-change-in-production!!
      AUTH_PUBLIC_BASE_URL: http://localhost:3000
      AUTH_FRONTEND_ORIGIN: http://localhost:5173
      # Dev-only default — override with a real 64-hex-char key in production.
      CREDENTIAL_ENCRYPTION_KEY: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  docker-proxy:
    image: tecnativa/docker-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      POST: 1
      EVENTS: 1
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      SWARM: 0
      BUILD: 0

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://herobids:herobids@postgres:5432/herobids
      REDIS_URL: redis://redis:6379
      # Dev-only default — override with a real 64-hex-char key in production.
      CREDENTIAL_ENCRYPTION_KEY: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
      DOCKER_HOST: tcp://docker-proxy:2375
      DOCKER_NETWORK: herobids_default
      AGENT_IMAGE: herobids-agent:latest
      # Set AGENT_RUNTIME_MODE=docker only after building the agent image:
      # docker build -f docker/Dockerfile.agent -t herobids-agent:latest .
      AGENT_RUNTIME_MODE: stub
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  pgdata:
