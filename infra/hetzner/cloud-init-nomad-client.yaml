#cloud-config
# Herobids Nomad client node first-boot provisioning for Ubuntu 24.04.
# Agent nodes are disposable (cattle, not pets) — they run only Docker + Nomad client.
# Template variables (substituted by Terraform templatefile):
#   ${server_name}        — Agent node hostname (e.g. herobids-agent-1)
#   ${environment}        — Deployment environment: staging | production
#   ${nomad_server_addr}  — Private IP of the Nomad server (control-plane host)
#   ${node_pool}          — Node pool name (matches var.server_name)
#   ${node_index}         — Zero-based index within the node pool
#   ${nomad_version}      — Nomad version to install
#   ${private_subnet}     — Private network subnet CIDR for UFW rules

package_update: true
package_upgrade: true

hostname: ${server_name}

packages:
  - ca-certificates
  - curl
  - gnupg
  - jq
  - ufw
  - fail2ban
  - unattended-upgrades

# ── Write files (runs before runcmd) ───────────────────────

write_files:
  - path: /etc/nomad.d/nomad.hcl
    permissions: '0644'
    content: |
      # Nomad client configuration — auto-generated by cloud-init.
      # Managed by Terraform; do not edit manually.
      data_dir = "/opt/nomad/data"

      bind_addr = "0.0.0.0"

      client {
        enabled = true

        node_class = "agent"

        servers = ["${nomad_server_addr}:4647"]

        server_join {
          retry_join = ["${nomad_server_addr}:4647"]
          retry_max  = 0
          retry_interval = "5s"
        }

        meta {
          environment = "${environment}"
          node_pool   = "${node_pool}"
          node_index  = "${node_index}"
        }

        options {
          "docker.volumes.enabled" = "true"
        }
      }

      server {
        enabled = false
      }

      plugin "docker" {
        config {
          allow_privileged = false
          volumes {
            enabled = true
          }
        }
      }

      advertise {
        http = "__PRIVATE_IP__"
      }

  - path: /etc/systemd/system/nomad.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Nomad Client
      Documentation=https://developer.hashicorp.com/nomad/docs
      Wants=network-online.target
      After=network-online.target docker.service
      Requires=docker.service

      [Service]
      ExecStart=/usr/bin/nomad agent -config=/etc/nomad.d/nomad.hcl
      ExecReload=/bin/kill -HUP $MAINPID
      KillMode=process
      KillSignal=SIGINT
      LimitNOFILE=65536
      LimitNPROC=infinity
      Restart=on-failure
      RestartSec=2
      TasksMax=infinity

      [Install]
      WantedBy=multi-user.target

# ── Boot commands (all POSIX sh — NO bash-isms, NO pipefail) ──

runcmd:
  # ── Install Docker CE ────────────────────────────────────
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

  # ── Enable Docker ────────────────────────────────────────
  - systemctl enable docker
  - systemctl start docker

  # ── Install Nomad ────────────────────────────────────────
  - wget -O- https://apt.releases.hashicorp.com/gpg 2>/dev/null | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
  - . /etc/os-release && echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $VERSION_CODENAME main" > /etc/apt/sources.list.d/hashicorp.list
  - apt-get update -y
  - apt-get install -y nomad=${nomad_version}-1

  # Create Nomad data directory
  - mkdir -p /opt/nomad/data

  # ── Configure UFW ────────────────────────────────────────
  # Agent nodes are on the private network — only SSH from internet.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw --force enable

  # ── Enable fail2ban ──────────────────────────────────────
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # ── Enable and start Nomad client ────────────────────────
  # Resolve the private network IP (from the Hetzner private network, not Docker's bridge)
  # and patch the Nomad config before starting.
  - |
    PRIVATE_IP=$(ip -4 addr show | grep -oP '10\.0\.\d+\.\d+' | head -1)
    if [ -n "$PRIVATE_IP" ]; then
      sed -i "s/__PRIVATE_IP__/$PRIVATE_IP/g" /etc/nomad.d/nomad.hcl
    else
      logger -t cloud-init "WARNING: Could not resolve private network IP — Nomad advertise will use placeholder"
    fi
  - systemctl daemon-reload
  - systemctl enable nomad
  - systemctl start nomad

final_message: "Cloud-init complete (${environment} agent node ${server_name}). Nomad client joined cluster at ${nomad_server_addr}."
