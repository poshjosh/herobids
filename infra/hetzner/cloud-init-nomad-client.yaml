#cloud-config
# Herobids Nomad client node first-boot provisioning for Ubuntu 24.04.
# Agent nodes are disposable (cattle, not pets) — they run only Docker + Nomad client.
# Template variables (substituted by Terraform templatefile):
#   ${server_name}        — Agent node hostname (e.g. herobids-agent-1)
#   ${environment}        — Deployment environment: staging | production
#   ${nomad_server_addr}  — Private IP of the Nomad server (control-plane host)
#   ${node_pool}          — Node pool name (matches var.server_name)
#   ${node_index}         — Zero-based index within the node pool
#   ${nomad_version}      — Nomad version to install
#   ${private_subnet}     — Private network subnet CIDR for UFW rules
#   ${redis_url}          — Redis connection URL for health reporting

package_update: true
package_upgrade: true

hostname: ${server_name}

packages:
  - ca-certificates
  - curl
  - gnupg
  - jq
  - redis-tools
  - ufw
  - fail2ban
  - unattended-upgrades

# ── Write files (runs before runcmd) ───────────────────────

write_files:
  - path: /etc/nomad.d/nomad.hcl
    permissions: '0644'
    content: |
      # Nomad client configuration — auto-generated by cloud-init.
      # Managed by Terraform; do not edit manually.
      data_dir = "/opt/nomad/data"

      bind_addr = "0.0.0.0"

      client {
        enabled = true

        node_class = "agent"

        servers = ["${nomad_server_addr}:4647"]

        server_join {
          retry_join = ["${nomad_server_addr}:4647"]
          retry_max  = 0
          retry_interval = "5s"
        }

        meta {
          environment = "${environment}"
          node_pool   = "${node_pool}"
          node_index  = "${node_index}"
        }

        options {
          "docker.volumes.enabled" = "true"
        }
      }

      server {
        enabled = false
      }

      plugin "docker" {
        config {
          allow_privileged = false
          volumes {
            enabled = true
          }
        }
      }

      acl {
        enabled = true
      }

      advertise {
        http = "__PRIVATE_IP__"
      }

  - path: /etc/systemd/system/nomad.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Nomad Client
      Documentation=https://developer.hashicorp.com/nomad/docs
      Wants=network-online.target
      After=network-online.target docker.service
      Requires=docker.service

      [Service]
      ExecStart=/usr/bin/nomad agent -config=/etc/nomad.d/nomad.hcl
      ExecReload=/bin/kill -HUP $MAINPID
      KillMode=process
      KillSignal=SIGINT
      LimitNOFILE=65536
      LimitNPROC=infinity
      Restart=on-failure
      RestartSec=2
      TasksMax=infinity

      [Install]
      WantedBy=multi-user.target

  - path: /opt/herobids/infra/hetzner/scripts/agent-node-health.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # agent-node-health.sh — Publish agent-node health snapshot to Redis.
      # NOTE: Standalone reference copy at infra/hetzner/scripts/agent-node-health.sh
      set -euo pipefail

      if [[ "$${1:-}" == "--help" || "$${1:-}" == "-h" ]]; then
        echo "Usage: $0 [--help]"
        echo ""
        echo "Publish agent-node health snapshot to Redis."
        echo ""
        echo "Environment variables:"
        echo "  REDIS_URL                   Redis connection URL (required)."
        echo "  AGENT_NODE_HEALTH_ENABLED   Feature flag (default: true)."
        exit 0
      fi

      ENABLED="$${AGENT_NODE_HEALTH_ENABLED:-true}"
      if [[ "$${ENABLED}" != "true" ]]; then
        exit 2
      fi

      if [[ -z "$${REDIS_URL:-}" ]]; then
        echo "ERROR: REDIS_URL is not set." >&2
        exit 1
      fi

      HOST="$(hostname 2>/dev/null || echo "unknown")"

      # ── Memory ──
      MEM_TOTAL=0
      MEM_USED=0
      MEM_FREE=0
      MEM_AVAILABLE_MB=0

      if FREE_OUTPUT="$(free -b 2>/dev/null)"; then
        MEM_LINE="$(echo "$${FREE_OUTPUT}" | grep '^Mem:')"
        MEM_TOTAL="$(echo "$${MEM_LINE}" | awk '{print $2}')"
        MEM_USED="$(echo "$${MEM_LINE}" | awk '{print $3}')"
        MEM_FREE="$(echo "$${MEM_LINE}" | awk '{print $4}')"
        MEM_AVAILABLE_BYTES="$(echo "$${MEM_LINE}" | awk '{print $7}')"
        if [[ -n "$${MEM_AVAILABLE_BYTES}" && "$${MEM_AVAILABLE_BYTES}" != "0" ]]; then
          MEM_AVAILABLE_MB=$(( MEM_AVAILABLE_BYTES / 1024 / 1024 ))
        fi
      fi

      # ── Disk ──
      DISK_AVAILABLE=false
      DISK_TOTAL=0
      DISK_USED=0
      DISK_FREE=0

      if DF_OUTPUT="$(df -B1 / 2>/dev/null)"; then
        DISK_LINE="$(echo "$${DF_OUTPUT}" | tail -1)"
        DISK_TOTAL="$(echo "$${DISK_LINE}" | awk '{print $2}')"
        DISK_USED="$(echo "$${DISK_LINE}" | awk '{print $3}')"
        DISK_FREE="$(echo "$${DISK_LINE}" | awk '{print $4}')"
        DISK_AVAILABLE=true
      fi

      if [[ "$${DISK_AVAILABLE}" == "true" ]]; then
        DISK_JSON="$(jq -n --argjson t "$${DISK_TOTAL}" --argjson u "$${DISK_USED}" --argjson f "$${DISK_FREE}" \
          '{ totalBytes: $t, usedBytes: $u, freeBytes: $f }')"
      else
        DISK_JSON="null"
      fi

      # ── CPU% via /proc/stat delta ──
      CPU_PCT="null"

      read_cpu_stats() {
        local line
        line="$(head -1 /proc/stat 2>/dev/null || echo "")"
        if [[ -n "$${line}" ]]; then
          echo "$${line}" | awk '{print $2, $3, $4, $5, $6, $7, $8, $9}'
        fi
      }

      CPU_BEFORE="$(read_cpu_stats)"
      if [[ -n "$${CPU_BEFORE}" ]]; then
        sleep 1
        CPU_AFTER="$(read_cpu_stats)"
        if [[ -n "$${CPU_AFTER}" ]]; then
          read -r b1 b2 b3 b4 b5 b6 b7 b8 <<< "$${CPU_BEFORE}"
          read -r a1 a2 a3 a4 a5 a6 a7 a8 <<< "$${CPU_AFTER}"
          IDLE_DELTA=$(( (a4 + a5) - (b4 + b5) ))
          TOTAL_DELTA=$(( (a1 + a2 + a3 + a4 + a5 + a6 + a7 + a8) - (b1 + b2 + b3 + b4 + b5 + b6 + b7 + b8) ))
          if [[ "$${TOTAL_DELTA}" -gt 0 ]]; then
            NON_IDLE_DELTA=$(( TOTAL_DELTA - IDLE_DELTA ))
            CPU_PCT=$(( NON_IDLE_DELTA * 100 / TOTAL_DELTA ))
          fi
        fi
      fi

      # ── Load average ──
      LOAD1="0"
      LOAD5="0"
      LOAD15="0"

      if [[ -f /proc/loadavg ]]; then
        read -r LOAD1 LOAD5 LOAD15 _ < /proc/loadavg 2>/dev/null || true
      fi

      # ── Uptime ──
      UPTIME_SECONDS=0

      if [[ -f /proc/uptime ]]; then
        RAW_UPTIME="$(awk '{print $1}' /proc/uptime 2>/dev/null || echo "0")"
        UPTIME_SECONDS="$${RAW_UPTIME%%.*}"
      fi

      # ── Nomad allocations ──
      # NOTE: `nomad node status -self` requires a read-capable token on ACL-enabled
      # clusters. Without NOMAD_TOKEN set, nomadAllocations will report 0.
      # A read-only token can be provisioned in a follow-up.
      NOMAD_ALLOCS=0

      if command -v nomad >/dev/null 2>&1; then
        NOMAD_ALLOCS="$(nomad node status -self -json 2>/dev/null | jq '.Allocations | length' 2>/dev/null || echo "0")"
        if [[ -z "$${NOMAD_ALLOCS}" || "$${NOMAD_ALLOCS}" == "null" ]]; then
          NOMAD_ALLOCS=0
        fi
      fi

      UPDATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # ── Build JSON ──
      JSON="$(jq -n \
        --arg serverType "agent-server" \
        --arg serverId "$${HOST}" \
        --arg hostname "$${HOST}" \
        --argjson memTotal "$${MEM_TOTAL}" \
        --argjson memUsed "$${MEM_USED}" \
        --argjson memFree "$${MEM_FREE}" \
        --argjson disk "$${DISK_JSON}" \
        --argjson cpuPct "$${CPU_PCT}" \
        --argjson load1 "$${LOAD1}" \
        --argjson load5 "$${LOAD5}" \
        --argjson load15 "$${LOAD15}" \
        --argjson uptimeSeconds "$${UPTIME_SECONDS}" \
        --arg version "n/a" \
        --arg updatedAt "$${UPDATED_AT}" \
        --argjson nomadAllocs "$${NOMAD_ALLOCS}" \
        --argjson availMemMb "$${MEM_AVAILABLE_MB}" \
        '{
          serverType: $serverType,
          serverId: $serverId,
          hostname: $hostname,
          memory: { totalBytes: $memTotal, usedBytes: $memUsed, freeBytes: $memFree },
          disk: $disk,
          cpuPct: $cpuPct,
          loadAvg: [$load1, $load5, $load15],
          uptimeSeconds: $uptimeSeconds,
          version: $version,
          updatedAt: $updatedAt,
          metadata: { nomadAllocations: $nomadAllocs, availableMemoryMb: $availMemMb }
        }'
      )"

      REDIS_KEY="herobids:server-health:agent-server:$${HOST}"

      if ! redis-cli -u "$${REDIS_URL}" SET "$${REDIS_KEY}" "$${JSON}" EX 60 >/dev/null 2>&1; then
        echo "ERROR: Failed to write health snapshot to Redis." >&2
        exit 1
      fi

      exit 0

  - path: /etc/systemd/system/agent-node-health.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Agent Node Health Publisher
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/opt/herobids/infra/hetzner/scripts/agent-node-health.sh
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=agent-node-health
      Environment=REDIS_URL=${redis_url}
      Environment=AGENT_NODE_HEALTH_ENABLED=true
      NoNewPrivileges=true
      PrivateTmp=true

  - path: /etc/systemd/system/agent-node-health.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=Agent Node Health Publisher Timer

      [Timer]
      OnUnitActiveSec=15s
      OnBootSec=60s
      RandomizedDelaySec=5s
      Unit=agent-node-health.service

      [Install]
      WantedBy=timers.target

# ── Boot commands (all POSIX sh — NO bash-isms, NO pipefail) ──

runcmd:
  # ── Install Docker CE ────────────────────────────────────
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

  # ── Enable Docker ────────────────────────────────────────
  - systemctl enable docker
  - systemctl start docker

  # ── Install Nomad ────────────────────────────────────────
  - wget -O- https://apt.releases.hashicorp.com/gpg 2>/dev/null | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
  - . /etc/os-release && echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $VERSION_CODENAME main" > /etc/apt/sources.list.d/hashicorp.list
  - apt-get update -y
  - apt-get install -y nomad=${nomad_version}-1

  # Create Nomad data directory
  - mkdir -p /opt/nomad/data

  # ── Configure UFW ────────────────────────────────────────
  # Agent nodes are on the private network — only SSH from internet.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw --force enable

  # ── Enable fail2ban ──────────────────────────────────────
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # ── Enable and start Nomad client ────────────────────────
  # Resolve the private network IP (from the Hetzner private network, not Docker's bridge)
  # and patch the Nomad config before starting.
  # ${private_subnet} is the Terraform-configured subnet CIDR (e.g. "10.0.0.0/24" for
  # staging, "10.1.0.0/24" for production). We extract the first two octets to build a
  # regex that matches the correct private network range.
  - |
    SUBNET_PREFIX=$(echo "${private_subnet}" | cut -d'.' -f1-2)
    PRIVATE_IP=$(ip -4 addr show | grep -oP "$SUBNET_PREFIX\.\d+\.\d+" | head -1)
    if [ -n "$PRIVATE_IP" ]; then
      sed -i "s/__PRIVATE_IP__/$PRIVATE_IP/g" /etc/nomad.d/nomad.hcl
    else
      logger -t cloud-init "WARNING: Could not resolve private network IP (subnet: ${private_subnet}) — Nomad advertise will use placeholder"
    fi
  - systemctl daemon-reload
  - systemctl enable nomad
  - systemctl start nomad

  # ── Enable agent-node health publisher ───────────────────
  - systemctl enable agent-node-health.timer
  - systemctl start agent-node-health.timer

final_message: "Cloud-init complete (${environment} agent node ${server_name}). Nomad client joined cluster at ${nomad_server_addr}."
