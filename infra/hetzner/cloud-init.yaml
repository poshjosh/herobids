#cloud-config
# Herobids first-boot provisioning for Ubuntu 24.04.
# Template variables (substituted by Terraform templatefile):
#   ${git_repo_url}                — Private repo URL (SSH, with deploy key)
#   ${git_branch}                  — Git branch to deploy
#   ${app_domain}                  — Application domain name
#   ${deploy_ssh_private_key_b64}  — SSH deploy key (base64-encoded)
#   ${server_name}                 — Server hostname
#   ${environment}                 — Deployment environment: staging | production
#   ${compose_overlay}             — Compose overlay filename (e.g. docker-compose.prod.yaml)
#   ${env_file}                    — Environment file name (e.g. .env.prod)
#   ${enable_nomad}                — Feature flag: "true" or "false"
#   ${nomad_version}               — Nomad version to install
#   ${private_subnet}              — Private network subnet CIDR for UFW rules
#   ${nomad_bootstrap_expect}      — Nomad server bootstrap_expect (1 for single-server)

package_update: true
package_upgrade: true

hostname: ${server_name}

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - jq
  - ufw
  - fail2ban
  - unattended-upgrades

# ── Write files (runs before runcmd) ───────────────────────

write_files:
  - path: /etc/cron.d/herobids-backup
    permissions: '0644'
    content: |
      # Daily Postgres backup with 14-day retention
      0 3 * * * root docker compose -f /opt/herobids/docker-compose.yaml -f /opt/herobids/${compose_overlay} exec -T postgres pg_dump -U herobids herobids > /opt/herobids-backup/herobids-$(date +\%Y\%m\%d).sql 2>> /var/log/herobids-backup.log || logger -t herobids-backup "pg_dump failed"

  - path: /etc/systemd/system/herobids.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Herobids Trading Platform
      Requires=docker.service
      After=docker.service network-online.target

      [Service]
      Type=simple
      WorkingDirectory=/opt/herobids
      ExecStart=docker compose -f /opt/herobids/docker-compose.yaml -f /opt/herobids/${compose_overlay} up
      ExecStop=docker compose -f /opt/herobids/docker-compose.yaml -f /opt/herobids/${compose_overlay} down
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=multi-user.target

  - path: /root/.ssh/deploy_key
    permissions: '0600'
    encoding: b64
    content: ${deploy_ssh_private_key_b64}

  - path: /etc/nomad.d/nomad.hcl
    permissions: '0644'
    content: |
      # Nomad server configuration — auto-generated by cloud-init.
      # Managed by Terraform; do not edit manually.
      data_dir = "/opt/nomad/data"

      bind_addr = "0.0.0.0"

      server {
        enabled          = true
        bootstrap_expect = ${nomad_bootstrap_expect}
      }

      client {
        enabled = false
      }

      advertise {
        http = "{{ GetPrivateIP }}"
        rpc  = "{{ GetPrivateIP }}"
        serf = "{{ GetPrivateIP }}"
      }

      plugin "docker" {
        config {
          allow_privileged = false
        }
      }

  - path: /etc/systemd/system/nomad.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Nomad
      Documentation=https://developer.hashicorp.com/nomad/docs
      Wants=network-online.target
      After=network-online.target

      [Service]
      ExecStart=/usr/bin/nomad agent -config=/etc/nomad.d/nomad.hcl
      ExecReload=/bin/kill -HUP $MAINPID
      KillMode=process
      KillSignal=SIGINT
      LimitNOFILE=65536
      LimitNPROC=infinity
      Restart=on-failure
      RestartSec=2
      TasksMax=infinity

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/nomad-autoscale.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Nomad Autoscale-Out Loop
      Documentation=https://github.com/your-org/herobids
      Wants=network-online.target nomad.service
      After=network-online.target nomad.service
      Requires=nomad.service

      [Service]
      Type=oneshot
      WorkingDirectory=/opt/herobids/infra/hetzner
      ExecStart=/opt/herobids/infra/hetzner/scripts/scale-out.sh
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=nomad-autoscale

      # Autoscale thresholds (overridable via drop-in or env)
      Environment=NOMAD_ADDR=http://127.0.0.1:4646
      Environment=NOMAD_SCALE_OUT_COOLDOWN_SECONDS=${scale_out_cooldown_seconds}
      Environment=NOMAD_SCALE_OUT_MEMORY_THRESHOLD_PCT=${scale_out_memory_threshold_pct}
      Environment=NOMAD_SCALE_OUT_SLOT_THRESHOLD=${scale_out_slot_threshold}
      Environment=NOMAD_SCALE_OUT_INCREMENT=${scale_out_increment}
      Environment=NOMAD_AGENT_MEMORY_RESERVATION_MB=${agent_memory_reservation_mb}
      Environment=HEROBIDS_ENV=${environment}
      Environment=TERRAFORM_DIR=/opt/herobids/infra/hetzner
      Environment=NOMAD_AUTOSCALE_LOCKFILE=/var/run/nomad-autoscale.lock
      Environment=NOMAD_AUTOSCALE_COOLDOWN_FILE=/var/run/nomad-autoscale-last-scale-out
      Environment=NOMAD_AUTOSCALE_LOG_FILE=/var/log/nomad-autoscale.log
      Environment=NOMAD_AUTOSCALE_NODE_COUNT_FILE=/var/run/nomad-autoscale-node-count

      # TF_VAR_* env vars are automatically read by terraform.
      # These mirror the autoscale config so terraform apply picks them up.
      Environment=TF_VAR_max_agent_nodes=${max_agent_nodes}
      Environment=TF_VAR_min_agent_nodes=${min_agent_nodes}
      Environment=TF_VAR_scale_out_cooldown_seconds=${scale_out_cooldown_seconds}
      Environment=TF_VAR_scale_out_memory_threshold_pct=${scale_out_memory_threshold_pct}
      Environment=TF_VAR_scale_out_slot_threshold=${scale_out_slot_threshold}
      Environment=TF_VAR_scale_out_increment=${scale_out_increment}
      Environment=TF_VAR_agent_memory_reservation_mb=${agent_memory_reservation_mb}
      Environment=TF_VAR_agent_node_server_type=${agent_node_server_type}
      Environment=TF_VAR_location=${location}

      # Security hardening: restrict privileges while allowing terraform state writes.
      # ProtectSystem=strict mounts /usr, /boot, /etc read-only.
      # /opt/herobids (where terraform state lives) remains writable.
      # Note: /tmp is NOT in ReadWritePaths — PrivateTmp=true gives the service
      # its own private /tmp, so writing to the shared /tmp is both unnecessary
      # and would conflict with PrivateTmp.
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths=/var/run /var/log /opt/herobids/infra/hetzner

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/nomad-autoscale.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=Nomad Autoscale-Out Timer
      Documentation=https://github.com/your-org/herobids

      [Timer]
      OnUnitActiveSec=60s
      OnBootSec=120s
      RandomizedDelaySec=15s
      Unit=nomad-autoscale.service

      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/system/nomad-scale-in.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Nomad Scale-In (Nightly Conservative Drain)
      Documentation=https://github.com/your-org/herobids
      Wants=network-online.target nomad.service
      After=network-online.target nomad.service
      Requires=nomad.service

      [Service]
      Type=oneshot
      WorkingDirectory=/opt/herobids/infra/hetzner
      ExecStart=/opt/herobids/infra/hetzner/scripts/scale-in.sh
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=nomad-scale-in

      # Scale-in configuration (overridable via drop-in or env)
      Environment=NOMAD_ADDR=http://127.0.0.1:4646
      Environment=HEROBIDS_ENV=${environment}
      Environment=TERRAFORM_DIR=/opt/herobids/infra/hetzner
      Environment=ENABLE_SCALE_IN=${enable_scale_in}
      Environment=NOMAD_SCALE_IN_MAX_NODES_PER_RUN=${scale_in_max_nodes_per_run}
      Environment=NOMAD_SCALE_IN_DRAIN_DEADLINE_SECONDS=${scale_in_drain_deadline_seconds}
      Environment=NOMAD_AUTOSCALE_LOCKFILE=/var/run/nomad-autoscale.lock
      Environment=NOMAD_AUTOSCALE_COOLDOWN_FILE=/var/run/nomad-autoscale-last-scale-out
      Environment=NOMAD_AUTOSCALE_LOG_FILE=/var/log/nomad-autoscale.log
      Environment=NOMAD_AUTOSCALE_NODE_COUNT_FILE=/var/run/nomad-autoscale-node-count

      # TF_VAR_* env vars for terraform (same as scale-out)
      Environment=TF_VAR_max_agent_nodes=${max_agent_nodes}
      Environment=TF_VAR_min_agent_nodes=${min_agent_nodes}
      Environment=TF_VAR_agent_node_server_type=${agent_node_server_type}
      Environment=TF_VAR_location=${location}

      # Security hardening (same profile as autoscale-out)
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths=/var/run /var/log /opt/herobids/infra/hetzner

  - path: /etc/systemd/system/nomad-scale-in.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=Nomad Scale-In Timer (Nightly Conservative Drain)
      Documentation=https://github.com/your-org/herobids

      [Timer]
      OnCalendar=*-*-* ${scale_in_time_utc}:00:00
      Persistent=true
      RandomizedDelaySec=300s
      Unit=nomad-scale-in.service

      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/system/nomad-placement-failure-watcher.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Nomad Placement-Failure Safety Net Watcher
      Documentation=https://github.com/your-org/herobids
      Wants=network-online.target nomad.service
      After=network-online.target nomad.service
      Requires=nomad.service

      [Service]
      Type=oneshot
      WorkingDirectory=/opt/herobids/infra/hetzner
      ExecStart=/opt/herobids/infra/hetzner/scripts/check-placement-failures.sh
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=nomad-placement-failure-watcher

      # Placement-failure safety net configuration
      Environment=NOMAD_ADDR=http://127.0.0.1:4646
      Environment=HEROBIDS_ENV=${environment}
      Environment=NOMAD_PLACEMENT_FAILURE_WINDOW_SECONDS=${placement_failure_window_seconds}
      Environment=NOMAD_PLACEMENT_FAILURE_THRESHOLD=${placement_failure_threshold}
      Environment=NOMAD_PLACEMENT_FAILURE_COOLDOWN_SECONDS=${placement_failure_cooldown_seconds}
      Environment=NOMAD_PLACEMENT_FAILURE_STATE_FILE=/var/run/nomad-placement-failure-state
      Environment=NOMAD_AUTOSCALE_LOCKFILE=/var/run/nomad-autoscale.lock
      Environment=NOMAD_AUTOSCALE_LOG_FILE=/var/log/nomad-autoscale.log
      Environment=NOMAD_AUTOSCALE_NODE_COUNT_FILE=/var/run/nomad-autoscale-node-count
      Environment=NOMAD_AUTOSCALE_COOLDOWN_FILE=/var/run/nomad-autoscale-last-scale-out

      # Security hardening
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths=/var/run /var/log /opt/herobids/infra/hetzner

  - path: /etc/systemd/system/nomad-placement-failure-watcher.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=Nomad Placement-Failure Watcher Timer
      Documentation=https://github.com/your-org/herobids

      [Timer]
      OnUnitActiveSec=120s
      OnBootSec=180s
      RandomizedDelaySec=30s
      Unit=nomad-placement-failure-watcher.service

      [Install]
      WantedBy=timers.target

# ── Boot commands (all POSIX sh — NO bash-isms, NO pipefail) ──

runcmd:
  # ── Install Docker CE ────────────────────────────────────
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

  # ── Enable Docker ────────────────────────────────────────
  - systemctl enable docker
  - systemctl start docker

  # ── Configure UFW ────────────────────────────────────────
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  # Allow agent nodes on the private network to reach shared services
  - ufw allow from ${private_subnet} to any port 5432 proto tcp
  - ufw allow from ${private_subnet} to any port 6379 proto tcp
  - ufw --force enable

  # ── Enable fail2ban ──────────────────────────────────────
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # ── Trust GitHub host key ────────────────────────────────
  - ssh-keyscan -H github.com >> /root/.ssh/known_hosts 2>/dev/null || true
  - chmod 644 /root/.ssh/known_hosts

  # ── Clone herobids repo ──────────────────────────────────
  - GIT_SSH_COMMAND="ssh -i /root/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" git clone --branch ${git_branch} ${git_repo_url} /opt/herobids

  # ── Configure git for future pushes ──────────────────────
  - git -C /opt/herobids config core.sshCommand "ssh -i /root/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"

  # ── Create .env from example ─────────────────────────────
  - cp -n /opt/herobids/.env.example /opt/herobids/${env_file}
  - chmod 600 /opt/herobids/${env_file}

  # ── Setup backup directory ───────────────────────────────
  - mkdir -p /opt/herobids-backup

  # ── Enable systemd service (don't start — .env needed) ───
  - systemctl daemon-reload
  - systemctl enable herobids.service

  # ── Nomad Server Setup (conditional on enable_nomad) ─────
  - |
    if [ "${enable_nomad}" = "true" ]; then
      # Install HashiCorp APT repository (Nomad + Terraform)
      wget -O- https://apt.releases.hashicorp.com/gpg 2>/dev/null | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
      . /etc/os-release && echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $VERSION_CODENAME main" > /etc/apt/sources.list.d/hashicorp.list
      apt-get update -y
      apt-get install -y nomad=${nomad_version}-1 terraform=${terraform_version}-1

      # Create Nomad data directory
      mkdir -p /opt/nomad/data

      # Initialize Terraform in the infra directory (repo already cloned above)
      # The terraform state backend is local — state lives on the control-plane filesystem.
      if [ -d /opt/herobids/infra/hetzner ]; then
        cd /opt/herobids/infra/hetzner
        terraform init -input=false || logger -t cloud-init "WARNING: terraform init failed — autoscale will not function until resolved."
      fi

      # Seed the autoscale node count file from the initial agent_node_count.
      # agent_node_count is set at provision time; the autoscaler will update this
      # file after each successful terraform apply.
      mkdir -p /var/run
      echo "${agent_node_count}" > /var/run/nomad-autoscale-node-count

      # Open Nomad ports on the private network interface
      # Nomad server ports: 4646 (HTTP), 4647 (RPC), 4648 (Serf)
      ufw allow from ${private_subnet} to any port 4646 proto tcp
      ufw allow from ${private_subnet} to any port 4647 proto tcp
      ufw allow from ${private_subnet} to any port 4648 proto tcp

      # Enable and start Nomad
      systemctl enable nomad
      systemctl start nomad

      # Enable autoscale timer (service runs after repo is cloned and scripts exist)
      # The timer starts polling 120s after boot; the service unit will fail
      # gracefully until scale-out.sh is available at /opt/herobids/infra/hetzner/scripts/.
      systemctl enable nomad-autoscale.timer
      systemctl start nomad-autoscale.timer

      # Enable placement-failure safety net watcher (Phase 7)
      # Polls Nomad evaluations for resource-exhaustion failures and triggers
      # emergency scale-out via scale-out.sh --safety-net.
      # The timer starts 180s after boot (after autoscale-out timer).
      systemctl enable nomad-placement-failure-watcher.timer
      systemctl start nomad-placement-failure-watcher.timer

      # Enable nightly scale-in timer (Phase 7)
      # The timer fires daily; the service is a no-op when ENABLE_SCALE_IN != true
      # or when already at min_agent_nodes.
      if [ "${enable_scale_in}" = "true" ]; then
        systemctl enable nomad-scale-in.timer
        systemctl start nomad-scale-in.timer
      fi

      # TODO(Phase 8): Enable Nomad ACLs for cluster security.
      # Currently the Nomad cluster has no access control — any process on the
      # private network can call the Nomad HTTP API. ACLs should be configured
      # when admin alerting and operator visibility are added in Phase 8.
      # See: https://developer.hashicorp.com/nomad/tutorials/access-control/access-control
    fi

final_message: "Cloud-init complete (${environment}). SSH in and upload ${env_file}, then run: cd /opt/herobids && docker compose -f docker-compose.yaml -f ${compose_overlay} up -d --build"
