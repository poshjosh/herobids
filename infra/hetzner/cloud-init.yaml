#cloud-config
# Herobids first-boot provisioning for Ubuntu 24.04.
# Template variables (substituted by Terraform templatefile):
#   ${git_repo_url}                — Private repo URL (SSH, with deploy key)
#   ${git_branch}                  — Git branch to deploy
#   ${app_domain}                  — Application domain name
#   ${deploy_ssh_private_key_b64}  — SSH deploy key (base64-encoded)
#   ${server_name}                 — Server hostname

package_update: true
package_upgrade: true

hostname: ${server_name}

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - ufw
  - fail2ban
  - unattended-upgrades

# ── Write files (runs before runcmd) ───────────────────────

write_files:
  - path: /etc/cron.d/herobids-backup
    permissions: '0644'
    content: |
      # Daily Postgres backup with 14-day retention
      0 3 * * * root docker compose -f /opt/herobids/docker-compose.yaml -f /opt/herobids/docker-compose.prod.yaml exec -T postgres pg_dump -U herobids herobids > /opt/herobids-backup/herobids-$(date +\%Y\%m\%d).sql 2>> /var/log/herobids-backup.log || logger -t herobids-backup "pg_dump failed"

  - path: /etc/systemd/system/herobids.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Herobids Trading Platform
      Requires=docker.service
      After=docker.service network-online.target

      [Service]
      Type=simple
      WorkingDirectory=/opt/herobids
      ExecStart=docker compose -f /opt/herobids/docker-compose.yaml -f /opt/herobids/docker-compose.prod.yaml up
      ExecStop=docker compose -f /opt/herobids/docker-compose.yaml -f /opt/herobids/docker-compose.prod.yaml down
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=multi-user.target

  - path: /root/.ssh/deploy_key
    permissions: '0600'
    encoding: b64
    content: ${deploy_ssh_private_key_b64}

# ── Boot commands (all POSIX sh — NO bash-isms, NO pipefail) ──

runcmd:
  # ── Install Docker CE ────────────────────────────────────
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

  # ── Enable Docker ────────────────────────────────────────
  - systemctl enable docker
  - systemctl start docker

  # ── Configure UFW ────────────────────────────────────────
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # ── Enable fail2ban ──────────────────────────────────────
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # ── Trust GitHub host key ────────────────────────────────
  - ssh-keyscan -H github.com >> /root/.ssh/known_hosts 2>/dev/null || true
  - chmod 644 /root/.ssh/known_hosts

  # ── Clone herobids repo ──────────────────────────────────
  - GIT_SSH_COMMAND="ssh -i /root/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" git clone --branch ${git_branch} ${git_repo_url} /opt/herobids

  # ── Configure git for future pushes ──────────────────────
  - git -C /opt/herobids config core.sshCommand "ssh -i /root/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"

  # ── Create .env from example ─────────────────────────────
  - cp -n /opt/herobids/.env.example /opt/herobids/.env
  - chmod 600 /opt/herobids/.env

  # ── Setup backup directory ───────────────────────────────
  - mkdir -p /opt/herobids-backup

  # ── Enable systemd service (don't start — .env needed) ───
  - systemctl daemon-reload
  - systemctl enable herobids.service

final_message: "Cloud-init complete. SSH in and upload .env, then run: cd /opt/herobids && docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --build"
