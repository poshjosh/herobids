# Map directive must live at the http context level, so it is placed here,
# outside the server block. Used to forward the WebSocket Upgrade/Connection
# headers for the real-time /events stream (see
# docs/bug-reports/2026/08/05/001-nginx-websocket-events-404.md).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the api service (strips /api prefix).
    # The /events WebSocket endpoint is proxied through here too, so the
    # Upgrade/Connection headers must be forwarded for the real-time event
    # stream to work.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Vite emits content-hashed filenames under /assets/ (e.g. index-DN1HNpQv.js),
    # so these are safe to cache aggressively and immutably — a new deploy always
    # ships new filenames, never reuses an old one with different content.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Serve the SPA — all unmatched routes fall back to index.html.
    # index.html is NOT hashed and references the current /assets/* bundle by
    # name, so it must never be cached — otherwise browsers can keep running a
    # stale JS bundle indefinitely after a deploy (no explicit Cache-Control
    # here previously meant browsers applied heuristic caching to index.html).
    # See docs/bug-reports/2026/07/18/004-gmail-oauth-stale-cached-spa-bundle.md.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
