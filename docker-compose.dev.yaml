# Development override — apply on top of the base stack:
#   docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up --build
#
# This override replaces the built-artifact runtime commands with hot-reload
# watch mode and bind-mounts source so edits are reflected without a full
# image rebuild.  Postgres, Redis, and migrate are inherited unchanged from
# the base stack.

services:
  api:
    image: herobids-api-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: build-shared   # shared packages compiled; tsx handles app source
    working_dir: /app/apps/api
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro
      - ./config:/app/config:ro
    command: ['node', '--import', 'tsx/esm', 'src/index.ts']
    environment:
      NODE_ENV: development
      LOG_FORMAT: pretty
      AUTH_FRONTEND_ORIGIN: http://localhost:${WEB_PORT:-8080}
      HEROBIDS_CONFIG_DIR: /app
      CREEM_API_KEY: ${CREEM_API_KEY:-}
      CREEM_WEBHOOK_SECRET: ${CREEM_WEBHOOK_SECRET:-}

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: build-shared
    working_dir: /app/apps/worker
    volumes:
      - ./apps/worker/src:/app/apps/worker/src:ro
      - ./config:/app/config:ro
    command: ['node', '--import', 'tsx/esm', 'src/index.ts']
    environment:
      NODE_ENV: development
      LOG_FORMAT: pretty
      HEROBIDS_CONFIG_DIR: /app

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: build
    working_dir: /app/apps/web
    ports:
      - "${WEB_PORT:-8080}:5173"
    volumes:
      - ./apps/web/src:/app/apps/web/src:ro
    command: ['pnpm', '--filter', '@herobids/web', 'run', 'dev', '--host', '0.0.0.0']
    environment:
      # dev-only env var that tells Vite's dev server where to forward /api requests
      # Proxy in vite.config.ts reads this to forward /api to the api service
      VITE_API_PROXY_TARGET: http://api:3000

  # Headless Chromium for agent web browsing (browserless/chromium, GPL — unmodified standalone service).
  # Host port 3001 avoids conflict with the API on 3000.
  browser-pool:
    image: ghcr.io/browserless/chromium:latest
    environment:
      MAX_CONCURRENT_SESSIONS: "2"
      TIMEOUT: "60000"
      QUEUE_LENGTH: "10"
      DEFAULT_LAUNCH_ARGS: '["--no-sandbox","--disable-dev-shm-usage"]'
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/json/version || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    # deploy.resources.limits is respected by Docker Compose v2 with the default
    # (local) provider. Older v1 or certain remote contexts may silently ignore it.
    deploy:
      resources:
        limits:
          memory: 2G
