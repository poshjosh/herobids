name: Slow Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, consume-traderton]

jobs:
  parity-drift:
    name: parity-drift
    runs-on: ubuntu-latest
    env:
      PARITY_DRIFT_CI: '1'
      HEROBIDS_ROOT: ${{ github.workspace }}/herobids
      TRADERTON_ROOT: ${{ github.workspace }}/traderton
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: herobids
      - uses: actions/checkout@v4
        with:
          repository: poshjosh/traderton
          ref: d60c56e56514b3ed0d262871d6febc75e18cc0b3
          path: traderton
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - working-directory: herobids
        run: pnpm test:slow