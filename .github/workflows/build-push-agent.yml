name: Build and Push Agent Image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-push-agent:
    name: build-push-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.agent
          push: true
          secrets: |
            "NPM_TOKEN=${{ secrets.GITHUB_TOKEN }}"
          # `latest` is the runtime default for the Nomad docker task; the
          # `sha-<commit>` tag is the immutable deploy-gate reference (see
          # traderton's wait-for-build.sh pattern for a future sha-pinned deploy).
          tags: |
            ghcr.io/poshjosh/herobids-agent:latest
            ghcr.io/poshjosh/herobids-agent:sha-${{ github.sha }}