# Staging overlay for docker-compose.yaml.
# Usage: docker compose -f docker-compose.yaml -f docker-compose.staging.yaml up -d
#
# Key differences from the production overlay:
#   - NODE_ENV=staging for API and worker
#   - Staging domain (staging.herobids.com) for auth origins
#   - Staging Caddyfile with staging.herobids.com TLS
#   - VITE_API_ORIGIN set to the staging API origin for OAuth redirects
#
# Shares the same base compose infrastructure (postgres, redis, etc.)
# but serves only staging domains and auth origins.

services:
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  api:
    environment:
      NODE_ENV: staging
      AUTH_PUBLIC_BASE_URL: https://staging.herobids.com
      AUTH_FRONTEND_ORIGIN: https://staging.herobids.com

  worker:
    environment:
      NODE_ENV: staging

  web:
    restart: unless-stopped
    build:
      args:
        VITE_API_ORIGIN: https://staging.herobids.com
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
